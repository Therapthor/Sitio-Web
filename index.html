<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liordark | Tienda Virtual</title>

<style>
:root {
  --accent: #ff3c3c;
  --bg: #111;
  --text: #eee;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* ===== HEADER ===== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: #1a1a1a;
  position: relative;
  z-index: 10;
}

.logo-container {
  display: flex;
  align-items: center;
}

.logo {
  width: 40px;
  border-radius: 50%;
  margin-right: 10px;
}

.store-name {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent);
}

.contact-btn {
  background: var(--accent);
  color: #fff;
  padding: 8px 16px;
  border-radius: 4px;
  text-decoration: none;
  transition: 0.3s;
}

.contact-btn:hover {
  background: #cc0000;
}

/* ===== PRODUCTOS ===== */
.productos {
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 15px;
  position: relative;
  z-index: 2;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 25px;
}

.producto {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(255,60,60,.15);
  transition: 0.3s;
  display: flex;
  flex-direction: column;
}

.producto:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 20px rgba(255,60,60,.4);
}

.producto img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 10px;
}

.producto h2 {
  font-size: 1rem;
}

.producto p {
  font-size: .85rem;
  color: #ccc;
  flex-grow: 1;
}

.precio {
  font-weight: bold;
  color: var(--accent);
}

/* ===== IDENTIDAD ===== */
.identidad {
  text-align: center;
  padding: 80px 20px;
  position: relative;
  z-index: 2;
}

.identidad-logo {
  width: 90px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  box-shadow: 0 0 15px rgba(255,60,60,.5);
}

.identidad h2 {
  margin-top: 20px;
  font-size: 1.8rem;
  color: var(--accent);
}

/* ===== FOOTER ===== */
footer {
  text-align: center;
  padding: 20px;
  background: #151515;
  color: #aaa;
  position: relative;
  z-index: 2;
}

/* ===== PARTICULAS ===== */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<header>
  <div class="logo-container">
    <img src="logo-liordark.jpg" class="logo">
    <span class="store-name">Liordark</span>
  </div>
  <a href="https://wa.me/51963081436" class="contact-btn">WhatsApp</a>
</header>

<section class="productos">
<h1>Cuentas Streaming</h1>
<div class="grid">
  <!-- (productos sin cambios) -->
</div>
</section>

<section class="identidad">
  <img src="logo-liordark.jpg" class="identidad-logo">
  <h2>Hola, soy 𝕷𝖎𝖔𝖗𝖉𝖆𝖗𝖐 🇵🇪</h2>
</section>

<footer>
  © 2025 Liordark. Todos los derechos reservados.
</footer>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let mouse = { x: null, y: null };

window.addEventListener("mousemove", e => {
  mouse.x = e.x;
  mouse.y = e.y;
});

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 1;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,60,60,0.8)";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#ff3c3c";
    ctx.fill();
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;

    const dx = mouse.x - this.x;
    const dy = mouse.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 120) {
      this.x -= dx / 20;
      this.y -= dy / 20;
    }

    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

    this.draw();
  }
}

const particles = [];
for (let i = 0; i < 80; i++) particles.push(new Particle());

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p => p.update());
  requestAnimationFrame(animate);
}
animate();

window.addEventListener("resize", () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});
</script>

</body>
</html>
